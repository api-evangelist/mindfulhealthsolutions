aid: mindfulhealthsolutions
name: Mindful Health Solutions
description: >-
  Mindful Health Solutions is a behavioral-health-care provider specializing in innovative, evidence-based
  psychiatric treatments for depression, anxiety, PTSD, OCD, and other treatment-resistant conditions. Founded
  in 2007 (originally as TMS Health Solutions) by Dr. Richard Bermudes, the company pioneered TMS-focused
  clinics in the United States and offers Transcranial Magnetic Stimulation (TMS), SPRAVATO (esketamine) nasal
  spray, IV Ketamine infusion therapy, medication management, and psychiatric care across roughly 20 clinics in
  California, Texas, and Washington. Mindful Health Solutions maintains one of the world's largest TMS and
  esketamine patient-outcome repositories. It is a portfolio company of Norwest Venture Partners. As a clinical
  healthcare provider it publishes no public developer API; this profile captures its identity, an AI-crawler
  llms.txt it publishes, and its domain-security posture.
